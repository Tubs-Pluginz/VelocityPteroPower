name: vpp-e2e-pelican

services:
  database:
    image: mariadb:10.11
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: vpp_root_password
      MYSQL_DATABASE: panel
      MYSQL_USER: pelican
      MYSQL_PASSWORD: vpp_panel_password
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - vpp-net

  cache:
    image: redis:alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - vpp-net

  panel:
    image: ghcr.io/pelican/panel:latest
    pull_policy: always
    depends_on:
      database:
        condition: service_healthy
      cache:
        condition: service_healthy
    environment:
      APP_URL: "http://panel"
      APP_INSTALLED: "true"
      APP_ENV: "production"
      APP_DEBUG: "true"
      XDG_DATA_HOME: "/pelican-data"
      DB_CONNECTION: "mariadb"
      DB_HOST: "database"
      DB_PORT: "3306"
      DB_DATABASE: "panel"
      DB_USERNAME: "pelican"
      DB_PASSWORD: "vpp_panel_password"
      CACHE_STORE: "redis"
      SESSION_DRIVER: "redis"
      QUEUE_CONNECTION: "redis"
      REDIS_HOST: "cache"
      MAIL_DRIVER: "log"
    volumes:
      - pelican-data:/pelican-data
      - ./bootstrap.php:/provision/bootstrap.php:ro
      - ../../eggs/egg-picolimbo-vpp-e2e.json:/provision/egg-picolimbo-vpp-e2e.json:ro
    ports:
      - "18082:80"
    networks:
      - vpp-net

  wings:
    image: ghcr.io/pelican/wings:latest
    pull_policy: always
    profiles: ["wings"]
    depends_on:
      - panel
    command: ["/usr/bin/wings", "--config", "/etc/pelican/config.yml", "--debug"]
    environment:
      TZ: "UTC"
      WINGS_UID: "988"
      WINGS_GID: "988"
      WINGS_USERNAME: "pelican"
    volumes:
      - "${DOCKER_SOCKET_PATH:-/var/run/docker.sock}:/var/run/docker.sock"
      - "/var/lib/docker/containers/:/var/lib/docker/containers/"
      - "${E2E_STATE_DIR}/wings-etc:/etc/pelican"
      - "${E2E_STATE_DIR}/wings-data:${E2E_STATE_DIR}/wings-data"
      - "${E2E_STATE_DIR}/wings-logs:/var/log/pelican"
      - "/tmp/pelican:/tmp/pelican"
      - "/run/wings:/run/wings"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "18083:8080"
    networks:
      - vpp-net

  webhook-sink:
    build:
      context: ../../runner
    command: ["webhook-sink.mjs"]
    volumes:
      - ../../../catalog:/catalog:ro
      - "${E2E_ARTIFACTS_DIR}:/artifacts:ro"
    networks:
      - vpp-net

  velocity:
    build:
      context: ../../velocity
    depends_on:
      - panel
      - webhook-sink
    environment:
      SHARED_DIR: /shared
      PLUGINS_SRC: /artifacts
      VPP_TEST_BRIDGE_PORT: "19090"
    volumes:
      - "${E2E_STATE_DIR}/shared:/shared"
      - "${E2E_ARTIFACTS_DIR}:/artifacts:ro"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "25577:25577"
      - "19090:19090"
    networks:
      - vpp-net

  runner:
    build:
      context: ../../runner
    profiles: ["run"]
    depends_on:
      - velocity
      - webhook-sink
    environment:
      PANEL_TYPE: "pelican"
      PANEL_URL: "http://panel"
      PANEL_API_KEY: "${PANEL_API_KEY:-}"
      VELOCITY_HOST: "velocity"
      VELOCITY_PORT: "25577"
      BRIDGE_URL: "http://velocity:19090"
      WEBHOOK_SINK_URL: "http://webhook-sink:19091"
      MC_VERSION: "${MC_VERSION:-1.21.4}"
      SHARED_DIR: "/shared"
      RESULTS_DIR: "/results"
    volumes:
      - "${E2E_STATE_DIR}/shared:/shared:ro"
      - "${E2E_RESULTS_DIR}:/results"
    networks:
      - vpp-net

volumes:
  pelican-data:

networks:
  vpp-net:
    name: vpp-e2e-pelican-net
