name: Modrinth Alpha (every commit)

on:
  push:
    branches: ['**']
    paths-ignore:
      - 'workflows/**'
      - 'README.md'

permissions:
  contents: read

concurrency:
  group: modrinth-alpha-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Detect changed addons
        id: changes
        run: |
          set -euo pipefail
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            BEFORE=$(git rev-parse HEAD~1 2>/dev/null || echo "")
          fi
          if [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            DIFF=$(git diff --name-only "$BEFORE" "$GITHUB_SHA" || true)
          else
            DIFF=$(git ls-files)
          fi
          echo "$DIFF" | head -200
          api_changed=false
          echo "$DIFF" | grep -qE '^vpp-api/' && api_changed=true || true
          webhooks=false
          scheduler=false
          move_history=false
          if $api_changed || echo "$DIFF" | grep -qE '^addons/webhooks/'; then webhooks=true; fi
          if $api_changed || echo "$DIFF" | grep -qE '^addons/scheduler/'; then scheduler=true; fi
          if $api_changed || echo "$DIFF" | grep -qE '^addons/move-history/'; then move_history=true; fi
          echo "webhooks=$webhooks" >> "$GITHUB_OUTPUT"
          echo "scheduler=$scheduler" >> "$GITHUB_OUTPUT"
          echo "move_history=$move_history" >> "$GITHUB_OUTPUT"
          echo "api_changed=$api_changed" >> "$GITHUB_OUTPUT"

      - name: Build reactor
        run: mvn -B -V -e -DskipTests package -Pdev

      - name: Determine version and rename artifact
        id: meta
        run: |
          set -euo pipefail
          POM_VERSION=$(mvn -q -Dexec.executable=echo \
            -Dexec.args='${project.version}' \
            --non-recursive org.codehaus.mojo:exec-maven-plugin:3.1.0:exec)
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          VERSION="${POM_VERSION}-${SHORT_SHA}"

          shopt -s nullglob
          CANDIDATES=(vpp-plugin/target/velocitypteropower-*-shaded.jar)
          if [ ${#CANDIDATES[@]} -lt 1 ]; then
            FILES=(vpp-plugin/target/velocitypteropower-*.jar)
            FILTERED=()
            for f in "${FILES[@]}"; do [[ "$f" != *-original.jar ]] && FILTERED+=("$f"); done
            CANDIDATES=("${FILTERED[@]}")
          fi
          if [ ${#CANDIDATES[@]} -lt 1 ]; then
            echo "No suitable JARs found in vpp-plugin/target directory"
            ls -l vpp-plugin/target || true
            exit 1
          fi
          SRC="${CANDIDATES[0]}"
          DST="vpp-plugin/target/velocitypteropower-${VERSION}.jar"
          mv "$SRC" "$DST"

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "artifact=${DST}" >> "$GITHUB_OUTPUT"

          mkdir -p dist/addons
          stage_jar() {
            local pattern="$1"
            local dest="$2"
            shopt -s nullglob
            local files=($pattern)
            for f in "${files[@]}"; do
              [[ "$f" == *-original.jar ]] && continue
              cp "$f" "$dest"
              return 0
            done
            return 1
          }
          stage_jar 'addons/webhooks/target/vpp-addon-webhooks-*.jar' dist/addons/vpp-addon-webhooks.jar || true
          stage_jar 'addons/scheduler/target/vpp-addon-scheduler-*.jar' dist/addons/vpp-addon-scheduler.jar || true
          stage_jar 'addons/move-history/target/vpp-addon-move-history-*.jar' dist/addons/vpp-addon-move-history.jar || true

      - name: Build alpha changelog text
        id: changelog
        run: |
          set -euo pipefail
          {
            echo "## Alpha build for branch: ${GITHUB_REF_NAME}"
            echo
            echo "> Automatic build; may be unstable."
            echo "> Discord: https://discord.pluginz.dev"
            echo
            echo "### Commits in this push"
            jq -r '.commits[] | "- " + .id[0:7] + " " + (.message | gsub("\r?\n"; " ")) + " (" + (.author.username // .author.name // "unknown") + ")"' \
              "$GITHUB_EVENT_PATH" || true
            echo
            echo "### Links"
            echo "- Branch: https://github.com/${GITHUB_REPOSITORY}/commits/${GITHUB_REF_NAME}"
            echo "- Commit: https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}"
          } > changelog.md
          {
            echo 'text<<EOF'
            cat changelog.md
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Publish plugin to Modrinth (alpha)
        uses: WiIIiam278/mc-publish@hangar
        with:
          modrinth-id: 1dDr5J4w
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-featured: false
          files: ${{ steps.meta.outputs.artifact }}
          name: VelocityPteroPower Alpha • ${{ steps.meta.outputs.short_sha }}
          version: ${{ steps.meta.outputs.version }}
          version-type: alpha
          changelog: ${{ steps.changelog.outputs.text }}
          loaders: |
            velocity
          game-versions: |
            1.13
            1.13.1
            1.13.2
            1.14
            1.14.1
            1.14.2
            1.14.3
            1.14.4
            1.15
            1.15.1
            1.15.2
            1.16
            1.16.1
            1.16.2
            1.16.3
            1.16.4
            1.16.5
            1.17
            1.17.1
            1.18
            1.18.1
            1.18.2
            1.19
            1.19.1
            1.19.2
            1.19.3
            1.19.4
            1.20
            1.20.1
            1.20.2
            1.20.3
            1.20.4
            1.20.5
            1.20.6
            1.21
            1.21.1
            1.21.2
            1.21.3
            1.21.4
            1.21.5
            1.21.6
            1.21.7
            1.21.8
            1.21.9
            1.21.10
          java: 25

      - name: Publish webhooks addon (alpha)
        if: steps.changes.outputs.webhooks == 'true'
        uses: WiIIiam278/mc-publish@hangar
        with:
          modrinth-id: 3UKAAshD
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: dist/addons/vpp-addon-webhooks.jar
          name: VPP Webhooks Alpha • ${{ steps.meta.outputs.short_sha }}
          version: ${{ steps.meta.outputs.version }}
          version-type: alpha
          changelog: ${{ steps.changelog.outputs.text }}
          loaders: |
            velocity
          java: 25

      - name: Publish scheduler addon (alpha)
        if: steps.changes.outputs.scheduler == 'true'
        uses: WiIIiam278/mc-publish@hangar
        with:
          modrinth-id: ZfIvLQ4D
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: dist/addons/vpp-addon-scheduler.jar
          name: VPP Scheduler Alpha • ${{ steps.meta.outputs.short_sha }}
          version: ${{ steps.meta.outputs.version }}
          version-type: alpha
          changelog: ${{ steps.changelog.outputs.text }}
          loaders: |
            velocity
          java: 25

      - name: Publish move-history addon (alpha)
        if: steps.changes.outputs.move_history == 'true'
        uses: WiIIiam278/mc-publish@hangar
        with:
          modrinth-id: KGDp7TnL
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: dist/addons/vpp-addon-move-history.jar
          name: VPP Move History Alpha • ${{ steps.meta.outputs.short_sha }}
          version: ${{ steps.meta.outputs.version }}
          version-type: alpha
          changelog: ${{ steps.changelog.outputs.text }}
          loaders: |
            velocity
          java: 25
