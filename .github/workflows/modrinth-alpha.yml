name: Modrinth Alpha (every commit)

on:
  push:
    branches: ['**']
    paths-ignore:
      - 'workflows/**'
      - 'README.md'

permissions:
  contents: read

concurrency:
  group: modrinth-alpha-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Modrinth rejects uploads with zero game versions (Velocity still tags MC versions).
      - name: Modrinth game versions
        id: versions
        run: |
          {
            echo 'list<<EOF'
            printf '%s\n' \
              1.13 1.13.1 1.13.2 \
              1.14 1.14.1 1.14.2 1.14.3 1.14.4 \
              1.15 1.15.1 1.15.2 \
              1.16 1.16.1 1.16.2 1.16.3 1.16.4 1.16.5 \
              1.17 1.17.1 \
              1.18 1.18.1 1.18.2 \
              1.19 1.19.1 1.19.2 1.19.3 1.19.4 \
              1.20 1.20.1 1.20.2 1.20.3 1.20.4 1.20.5 1.20.6 \
              1.21 1.21.1 1.21.2 1.21.3 1.21.4 1.21.5 1.21.6 1.21.7 1.21.8 1.21.9 1.21.10 1.21.11 \
              26.1 26.1.1 26.1.2 \
              26.2 \
              26.3
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build reactor
        run: mvn -B -V -e -DskipTests package -Pdev

      - name: Determine version and rename artifact
        id: meta
        run: |
          set -euo pipefail
          POM_VERSION=$(mvn -q -Dexec.executable=echo \
            -Dexec.args='${project.version}' \
            --non-recursive org.codehaus.mojo:exec-maven-plugin:3.1.0:exec)
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          VERSION="${POM_VERSION}-${SHORT_SHA}"

          shopt -s nullglob
          CANDIDATES=(vpp-plugin/target/velocitypteropower-*-shaded.jar)
          if [ ${#CANDIDATES[@]} -lt 1 ]; then
            FILES=(vpp-plugin/target/velocitypteropower-*.jar)
            FILTERED=()
            for f in "${FILES[@]}"; do [[ "$f" != *-original.jar ]] && FILTERED+=("$f"); done
            CANDIDATES=("${FILTERED[@]}")
          fi
          if [ ${#CANDIDATES[@]} -lt 1 ]; then
            echo "No suitable JARs found in vpp-plugin/target directory"
            ls -l vpp-plugin/target || true
            exit 1
          fi
          SRC="${CANDIDATES[0]}"
          DST="vpp-plugin/target/velocitypteropower-${VERSION}.jar"
          mv "$SRC" "$DST"

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "artifact=${DST}" >> "$GITHUB_OUTPUT"

      - name: Build alpha changelog text
        id: changelog
        run: |
          set -euo pipefail
          {
            echo "## Alpha build for branch: ${GITHUB_REF_NAME}"
            echo
            echo "> Automatic build; may be unstable."
            echo "> Discord: https://discord.pluginz.dev"
            echo
            echo "### Commits in this push"
            jq -r '.commits[] | "- " + .id[0:7] + " " + (.message | gsub("\r?\n"; " ")) + " (" + (.author.username // .author.name // "unknown") + ")"' \
              "$GITHUB_EVENT_PATH" || true
            echo
            echo "### Links"
            echo "- Branch: https://github.com/${GITHUB_REPOSITORY}/commits/${GITHUB_REF_NAME}"
            echo "- Commit: https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}"
          } > changelog.md
          {
            echo 'text<<EOF'
            cat changelog.md
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Publish plugin to Modrinth (alpha)
        uses: WiIIiam278/mc-publish@hangar
        with:
          modrinth-id: 1dDr5J4w
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-featured: false
          files: ${{ steps.meta.outputs.artifact }}
          name: VelocityPteroPower Alpha • ${{ steps.meta.outputs.short_sha }}
          version: ${{ steps.meta.outputs.version }}
          version-type: alpha
          changelog: ${{ steps.changelog.outputs.text }}
          loaders: |
            velocity
          game-versions: ${{ steps.versions.outputs.list }}
          java: 25
