name: Modrinth Alpha + Nightly (every commit)

# On every push:
# - Publish plugin alpha to Modrinth
# - Refresh the rolling GitHub `nightly` prerelease (plugin + official addons)

on:
  push:
    branches: ['**']
    paths-ignore:
      - 'workflows/**'
      - 'README.md'

permissions:
  contents: write

concurrency:
  group: modrinth-alpha-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Modrinth rejects uploads with zero game versions (Velocity still tags MC versions).
      - name: Modrinth game versions
        id: versions
        run: |
          {
            echo 'list<<EOF'
            printf '%s\n' \
              1.13 1.13.1 1.13.2 \
              1.14 1.14.1 1.14.2 1.14.3 1.14.4 \
              1.15 1.15.1 1.15.2 \
              1.16 1.16.1 1.16.2 1.16.3 1.16.4 1.16.5 \
              1.17 1.17.1 \
              1.18 1.18.1 1.18.2 \
              1.19 1.19.1 1.19.2 1.19.3 1.19.4 \
              1.20 1.20.1 1.20.2 1.20.3 1.20.4 1.20.5 1.20.6 \
              1.21 1.21.1 1.21.2 1.21.3 1.21.4 1.21.5 1.21.6 1.21.7 1.21.8 1.21.9 1.21.10 1.21.11 \
              26.1 26.1.1 26.1.2 \
              26.2 \
              26.3
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build reactor
        run: mvn -B -V -e -DskipTests package -Pdev

      - name: Determine version and stage jars
        id: meta
        run: |
          set -euo pipefail
          POM_VERSION=$(mvn -q -Dexec.executable=echo \
            -Dexec.args='${project.version}' \
            --non-recursive org.codehaus.mojo:exec-maven-plugin:3.1.0:exec)
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          VERSION="${POM_VERSION}-${SHORT_SHA}"

          shopt -s nullglob
          CANDIDATES=(vpp-plugin/target/velocitypteropower-*-shaded.jar)
          if [ ${#CANDIDATES[@]} -lt 1 ]; then
            FILES=(vpp-plugin/target/velocitypteropower-*.jar)
            FILTERED=()
            for f in "${FILES[@]}"; do [[ "$f" != *-original.jar ]] && FILTERED+=("$f"); done
            CANDIDATES=("${FILTERED[@]}")
          fi
          if [ ${#CANDIDATES[@]} -lt 1 ]; then
            echo "No suitable JARs found in vpp-plugin/target directory"
            ls -l vpp-plugin/target || true
            exit 1
          fi

          mkdir -p dist/addons
          PLUGIN_JAR="dist/velocitypteropower-${VERSION}.jar"
          cp "${CANDIDATES[0]}" "$PLUGIN_JAR"

          stage_jar() {
            local pattern="$1"
            local dest="$2"
            local files=($pattern)
            for f in "${files[@]}"; do
              [[ "$f" == *-original.jar ]] && continue
              cp "$f" "$dest"
              echo "Staged $f -> $dest"
              return 0
            done
            echo "Missing jar for $dest (pattern $pattern)" >&2
            exit 1
          }
          stage_jar 'addons/webhooks/target/vpp-addon-webhooks-*.jar' dist/addons/vpp-addon-webhooks.jar
          stage_jar 'addons/scheduler/target/vpp-addon-scheduler-*.jar' dist/addons/vpp-addon-scheduler.jar
          stage_jar 'addons/move-history/target/vpp-addon-move-history-*.jar' dist/addons/vpp-addon-move-history.jar

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "artifact=${PLUGIN_JAR}" >> "$GITHUB_OUTPUT"

      - name: Build alpha changelog text
        id: changelog
        run: |
          set -euo pipefail
          {
            echo "## Alpha build for branch: ${GITHUB_REF_NAME}"
            echo
            echo "> Automatic build; may be unstable."
            echo "> Discord: https://discord.pluginz.dev"
            echo
            echo "### Commits in this push"
            jq -r '.commits[] | "- " + .id[0:7] + " " + (.message | gsub("\r?\n"; " ")) + " (" + (.author.username // .author.name // "unknown") + ")"' \
              "$GITHUB_EVENT_PATH" || true
            echo
            echo "### Links"
            echo "- Branch: https://github.com/${GITHUB_REPOSITORY}/commits/${GITHUB_REF_NAME}"
            echo "- Commit: https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}"
          } > changelog.md
          {
            echo 'text<<EOF'
            cat changelog.md
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Publish plugin to Modrinth (alpha)
        uses: WiIIiam278/mc-publish@hangar
        with:
          modrinth-id: 1dDr5J4w
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-featured: false
          files: ${{ steps.meta.outputs.artifact }}
          name: VelocityPteroPower Alpha • ${{ steps.meta.outputs.short_sha }}
          version: ${{ steps.meta.outputs.version }}
          version-type: alpha
          changelog: ${{ steps.changelog.outputs.text }}
          loaders: |
            velocity
          game-versions: ${{ steps.versions.outputs.list }}
          java: 25

      - name: Refresh GitHub nightly release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.meta.outputs.version }}
          SHORT_SHA: ${{ steps.meta.outputs.short_sha }}
        run: |
          set -euo pipefail
          PLUGIN_JAR="${{ steps.meta.outputs.artifact }}"
          NOTES_FILE=$(mktemp)
          {
            echo "## Nightly build"
            echo
            echo "Always overwritten with the latest successful CI build (any branch)."
            echo
            echo "- Version: \`${VERSION}\`"
            echo "- Branch: \`${GITHUB_REF_NAME}\`"
            echo "- Commit: [\`${SHORT_SHA}\`](https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA})"
            echo
            echo "Plugin alpha is also on [Modrinth](https://modrinth.com/plugin/velocitypteropower)."
            echo "Official addons are GitHub-only (drop into \`plugins/VelocityPteroPower/addons/\`)."
            echo
            echo "### Commits in this push"
            cat changelog.md
          } > "$NOTES_FILE"

          gh release delete nightly --yes 2>/dev/null || true
          git push origin :refs/tags/nightly 2>/dev/null || true
          git tag -f nightly "$GITHUB_SHA"
          git push origin nightly --force

          gh release create nightly \
            --prerelease \
            --title "Nightly • ${SHORT_SHA} (${GITHUB_REF_NAME})" \
            --notes-file "$NOTES_FILE" \
            "$PLUGIN_JAR" \
            dist/addons/vpp-addon-webhooks.jar \
            dist/addons/vpp-addon-scheduler.jar \
            dist/addons/vpp-addon-move-history.jar
