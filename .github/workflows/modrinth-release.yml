name: Modrinth Publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build plugin and official addons
        run: mvn -B -V -e -DskipTests package -Pbeta

      - name: Determine version and stage addon jars
        id: meta
        run: |
          set -euo pipefail
          POM_VERSION=$(mvn -q -Dexec.executable=echo -Dexec.args='${project.version}' \
            --non-recursive org.codehaus.mojo:exec-maven-plugin:3.1.0:exec)
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG_NAME="${{ github.event.release.tag_name }}"
            VERSION=${TAG_NAME#v}
          else
            VERSION="${POM_VERSION}-${SHORT_SHA}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          ARTIFACT=$(ls vpp-plugin/target/velocitypteropower-*-shaded.jar | head -n1)
          echo "artifact=${ARTIFACT}" >> "$GITHUB_OUTPUT"

          mkdir -p dist/addons
          stage_jar() {
            local pattern="$1"
            local dest="$2"
            shopt -s nullglob
            local files=($pattern)
            for f in "${files[@]}"; do
              [[ "$f" == *-original.jar ]] && continue
              cp "$f" "$dest"
              echo "Staged $f -> $dest"
              return 0
            done
            echo "Missing jar for $dest (pattern $pattern)" >&2
            exit 1
          }
          stage_jar 'addons/webhooks/target/vpp-addon-webhooks-*.jar' dist/addons/vpp-addon-webhooks.jar
          stage_jar 'addons/scheduler/target/vpp-addon-scheduler-*.jar' dist/addons/vpp-addon-scheduler.jar
          stage_jar 'addons/move-history/target/vpp-addon-move-history-*.jar' dist/addons/vpp-addon-move-history.jar

      - name: Publish plugin to Modrinth
        uses: WiIIiam278/mc-publish@hangar
        with:
          modrinth-id: 1dDr5J4w
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-featured: true
          files: ${{ steps.meta.outputs.artifact }}
          name: VelocityPteroPower v${{ steps.meta.outputs.version }}
          version: ${{ steps.meta.outputs.version }}
          version-type: beta
          changelog: ${{ github.event.release.body || github.event.head_commit.message }}
          loaders: |
            velocity
          game-versions: |
            1.13
            1.13.1
            1.13.2
            1.14
            1.14.1
            1.14.2
            1.14.3
            1.14.4
            1.15
            1.15.1
            1.15.2
            1.16
            1.16.1
            1.16.2
            1.16.3
            1.16.4
            1.16.5
            1.17
            1.17.1
            1.18
            1.18.1
            1.18.2
            1.19
            1.19.1
            1.19.2
            1.19.3
            1.19.4
            1.20
            1.20.1
            1.20.2
            1.20.3
            1.20.4
            1.20.5
            1.20.6
            1.21
            1.21.1
            1.21.2
            1.21.3
            1.21.4
            1.21.5
            1.21.6
            1.21.7
            1.21.8
            1.21.9
            1.21.10
          java: 25

      - name: Publish webhooks addon
        uses: WiIIiam278/mc-publish@hangar
        with:
          modrinth-id: 3UKAAshD
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: dist/addons/vpp-addon-webhooks.jar
          name: VPP Webhooks v${{ steps.meta.outputs.version }}
          version: ${{ steps.meta.outputs.version }}
          version-type: beta
          changelog: ${{ github.event.release.body || 'Official VPP webhooks addon' }}
          loaders: |
            velocity
          java: 25

      - name: Publish scheduler addon
        uses: WiIIiam278/mc-publish@hangar
        with:
          modrinth-id: ZfIvLQ4D
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: dist/addons/vpp-addon-scheduler.jar
          name: VPP Scheduler v${{ steps.meta.outputs.version }}
          version: ${{ steps.meta.outputs.version }}
          version-type: beta
          changelog: ${{ github.event.release.body || 'Official VPP scheduler addon' }}
          loaders: |
            velocity
          java: 25

      - name: Publish move-history addon
        uses: WiIIiam278/mc-publish@hangar
        with:
          modrinth-id: KGDp7TnL
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: dist/addons/vpp-addon-move-history.jar
          name: VPP Move History v${{ steps.meta.outputs.version }}
          version: ${{ steps.meta.outputs.version }}
          version-type: beta
          changelog: ${{ github.event.release.body || 'Official VPP move-history addon' }}
          loaders: |
            velocity
          java: 25

      - name: Upload addon jars to GitHub Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ github.event.release.tag_name }}"
          gh release upload "$TAG" \
            dist/addons/vpp-addon-webhooks.jar \
            dist/addons/vpp-addon-scheduler.jar \
            dist/addons/vpp-addon-move-history.jar \
            --clobber
