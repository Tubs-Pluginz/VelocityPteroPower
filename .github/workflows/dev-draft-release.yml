name: Dev Draft Release

# On push/merge to dev only: create an editable GitHub release draft
# pre-filled with commit messages and built jars (plugin + official addons).

on:
  push:
    branches: [dev]
    paths-ignore:
      - '.github/workflows/**'
      - 'README.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dev-draft-release
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build reactor
        run: mvn -B -V -e -DskipTests package -Pdev

      - name: Stage artifacts
        id: meta
        run: |
          set -euo pipefail
          POM_VERSION=$(mvn -q -Dexec.executable=echo \
            -Dexec.args='${project.version}' \
            --non-recursive org.codehaus.mojo:exec-maven-plugin:3.1.0:exec)
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          VERSION="${POM_VERSION}-${SHORT_SHA}"
          TAG="draft-${SHORT_SHA}"

          mkdir -p dist/addons
          shopt -s nullglob
          CANDIDATES=(vpp-plugin/target/velocitypteropower-*-shaded.jar)
          if [ ${#CANDIDATES[@]} -lt 1 ]; then
            echo "No shaded plugin jar found" >&2
            ls -l vpp-plugin/target || true
            exit 1
          fi
          PLUGIN_JAR="dist/velocitypteropower-${VERSION}.jar"
          cp "${CANDIDATES[0]}" "$PLUGIN_JAR"

          stage_jar() {
            local pattern="$1"
            local dest="$2"
            local files=($pattern)
            for f in "${files[@]}"; do
              [[ "$f" == *-original.jar ]] && continue
              cp "$f" "$dest"
              echo "Staged $f -> $dest"
              return 0
            done
            echo "Missing jar for $dest (pattern $pattern)" >&2
            exit 1
          }
          stage_jar 'addons/webhooks/target/vpp-addon-webhooks-*.jar' dist/addons/vpp-addon-webhooks.jar
          stage_jar 'addons/scheduler/target/vpp-addon-scheduler-*.jar' dist/addons/vpp-addon-scheduler.jar
          stage_jar 'addons/move-history/target/vpp-addon-move-history-*.jar' dist/addons/vpp-addon-move-history.jar

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "pom_version=${POM_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "artifact=${PLUGIN_JAR}" >> "$GITHUB_OUTPUT"

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
          SHORT_SHA: ${{ steps.meta.outputs.short_sha }}
          POM_VERSION: ${{ steps.meta.outputs.pom_version }}
          PLUGIN_JAR: ${{ steps.meta.outputs.artifact }}
        run: |
          set -euo pipefail
          NOTES_FILE=$(mktemp)
          BEFORE="${{ github.event.before }}"

          {
            echo "## Draft release for \`${POM_VERSION}\`"
            echo
            echo "Edit this draft freely, then publish when ready."
            echo "Publishing will also push the plugin to Modrinth; addons stay on this GitHub release."
            echo
            echo "- Suggested version: \`${VERSION}\`"
            echo "- Commit: [\`${SHORT_SHA}\`](https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA})"
            echo "- Tag: \`${TAG}\` (create a clean \`vX.Y.Z\` release later if you need a semver tag)"
            echo
            echo "### Commits"
            if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
              && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
              git log --pretty=format:'- %h %s (%an)' "${BEFORE}..${GITHUB_SHA}"
              echo
            elif jq -e '.commits | length > 0' "$GITHUB_EVENT_PATH" >/dev/null 2>&1; then
              jq -r '.commits[] | "- " + .id[0:7] + " " + (.message | gsub("\r?\n"; " ")) + " (" + (.author.username // .author.name // "unknown") + ")"' \
                "$GITHUB_EVENT_PATH"
            else
              git log -10 --pretty=format:'- %h %s (%an)'
              echo
            fi
          } > "$NOTES_FILE"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; refreshing notes + assets"
            gh release upload "$TAG" \
              "$PLUGIN_JAR" \
              dist/addons/vpp-addon-webhooks.jar \
              dist/addons/vpp-addon-scheduler.jar \
              dist/addons/vpp-addon-move-history.jar \
              --clobber
            gh release edit "$TAG" --notes-file "$NOTES_FILE"
            exit 0
          fi

          gh release create "$TAG" \
            --draft \
            --title "Draft ${POM_VERSION} • ${SHORT_SHA}" \
            --notes-file "$NOTES_FILE" \
            --target "$GITHUB_SHA" \
            "$PLUGIN_JAR" \
            dist/addons/vpp-addon-webhooks.jar \
            dist/addons/vpp-addon-scheduler.jar \
            dist/addons/vpp-addon-move-history.jar
